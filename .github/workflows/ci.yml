name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, to catch a project's Pages site or repo going away even when
  # nothing in this repo changed.
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  validate-site:
    name: Validate HTML + links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Offline structure + local-asset unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check every HTML page (structure, local assets, link liveness)
        run: find . -name '*.html' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 python3 scripts/check_site.py
